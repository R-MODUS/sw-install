# ============================================================
# R-MODUS: vzor robot profilu (bez Wi-Fi secretů)
# ============================================================
# Po instalaci: ~/rmodus/configs/profiles/rmodus-example.yaml
# Aktivní jméno: ~/rmodus/configs/active  (např. rmodus-example)
# Síť zvlášť:   ~/rmodus/configs/network.yaml
# Reinstall vždy přepíše tento soubor — vlastní úpravy dej do jiného profilu.
#
# Bloky:  meta, boot, web, bringup, /** (hardware / ROS 2)
#
# bringup: + /** musí sedět s:
#   rmodus_bringup/config/rmodus.yaml
# ============================================================

meta:
  source: rmodus-example
  title: Example Profile
  last_used: ""
  copied_at: ""

# ============================================================
# rmodus.service — false = entrypoint skončí bez bringupu
# (síť: boot.network v network.yaml)
# ============================================================

boot:
  rmodus: true

# ============================================================

web:
  # true  = vývojový režim (bez přihlašování)
  testing: true

  # Kořen configs (install.py → ~/rmodus/configs). Prázdné = odvoď z --config
  # (…/profiles/*.yaml) nebo $RMODUS_CONFIGS / ~/rmodus/configs.
  configs_root: ""

  host: "0.0.0.0"
  port: 8080
  log_level: info

  operator_pin: "1234"
  admin_pin: "4321"

  tf:
    root_frame: base_link
    broadcast_rate_hz: 5.0
    stale_timeout_sec: 3.0
    resubscribe_cooldown_sec: 8.0

  topics:
    lidar: /scan
    imu: /imu/data
    bumper_prefix: /bumper/
    cliff_prefix: /cliff/
    flow_prefix: /visual_flow/
    map: /map
    map_updates: /map_updates
    plan: /received_global_plan
    goal_pose: /goal_pose
    cmd_vel: /web/cmd_vel     # joystick = vstup web v cmd_mux
    e_stop_state: /rmodus/e_stop
    e_stop_request: /rmodus/e_stop/request
    e_stop_reset: /rmodus/e_stop/reset
    discovery_rate_hz: 1.0

  cmd:
    use_twist_stamped: false   # musí sedět s cmd_mux.use_stamped
    frame_id: base_link

  ui:
    persist_local: true
    nav_tabs:
      status: true
      controls: true
      map: true
      sensors: true
      tf: true
      docs: true
      config: true   # záložka Profily
      settings: true # Network settings
      users: true

# ============================================================
# Níže: stejné jako rmodus_bringup/config/rmodus.yaml
# ============================================================

bringup:
  config: true
  chassis: false
  description: false
  hw: false
  uart_output: false
  estop: false        # false = cmd_mux bez zámku (test bez stopky)
  cmd_mux: true       # twist_mux: teleop > web > nav → /cmd_vel
  bumper: true
  cliff: false
  flow: false
  display: false
  web: true
  rviz: false
  sim: false
  localization: false
  navigation: false
  slam: false
  rf2o: false
  obstacle_cloud: false
  microros: true
  # Vlastní launchy. enabled: false polozku nespusti, zvlastni definice zustava.
  extras:
    - enabled: false
      package: neato_lidar
      launch: neato_lidar.launch.py
      args:
        config_file: $robot_yaml
  # - enabled: false
  #   path: ~/my_stack/extra.launch.py

# Jedna deska = jedna položka a jeden agent. device je seriový port (ls /dev/ttyACM* /dev/ttyUSB*).
# Firmware bumperů běží na 115200. Další desku přidej jako další item s jiným device.
microros:
  enabled: true
  items:
    - name: bumpers
      enabled: true
      transport: serial
      device: /dev/ttyACM0
      baudrate: 115200
    # Driver unit pohonu. Víc ESP = stabilní cesty /dev/serial/by-id/... místo ttyACM*.
    - name: drive
      enabled: false
      transport: serial
      device: /dev/ttyACM1
      baudrate: 115200

/**:
  ros__parameters:

    base_link:
      mass: 5.0
      size: [0.5, 0.5, 0.1]
      offset_z: 0.0973

    # Pohon (host): /cmd_vel → kinematika → rychlosti kol [rad/s] na driver units.
    # Spouští se s bringup.chassis. Unit = ESP s N kanály (PID + enkodéry), kinematiku nezná.
    #   cmd_topic   std_msgs/Float32MultiArray  rad/s na kanál (index = channel), 20 Hz, nuly po timeoutu
    #   state_topic std_msgs/Int32MultiArray    kumulativní tiky na kanál; "" = unit bez zpětné vazby
    # /odom jen když wheel_odom.enabled a kola mají zpětnou vazbu (ticks_per_rev > 0).
    # mode: diff2 (wheel_l, wheel_r) | diff4 / mecanum (wheel_fl, wheel_fr, wheel_rl, wheel_rr)
    # Kola lze rozdělit na víc units (např. přední a zadní ESP) — každé kolo má svůj unit + channel.
    drive:
      enabled: true
      mode: mecanum
      wheel_radius: 0.05       # m
      track_width: 0.38        # m, vzdálenost levé a pravé řady kol (u diff4 efektivní)
      wheelbase: 0.24          # m, přední–zadní náprava (mecanum)
      max_wheel_speed: 10.0    # rad/s; nad limitem se zpomalí všechna kola poměrově
      cmd_timeout_sec: 0.5
      joint_states: true
      units:
        - name: main
          cmd_topic: /drive/main/cmd
          state_topic: /drive/main/state
      wheels:
        - { name: wheel_fl, unit: main, channel: 0, invert: false, ticks_per_rev: 1440 }
        - { name: wheel_fr, unit: main, channel: 1, invert: true,  ticks_per_rev: 1440 }
        - { name: wheel_rl, unit: main, channel: 2, invert: false, ticks_per_rev: 1440 }
        - { name: wheel_rr, unit: main, channel: 3, invert: true,  ticks_per_rev: 1440 }
      # Příklad diff2 s unit bez enkodérů:
      # mode: diff2
      # units:
      #   - { name: main, cmd_topic: /drive/main/cmd, state_topic: "" }
      # wheels:
      #   - { name: wheel_l, unit: main, channel: 0 }
      #   - { name: wheel_r, unit: main, channel: 1, invert: true }

    rmodus_module:
      mass: 2.0
      size: [0.25, 0.25, 0.05]
      offset_x: 0.032
      offset_y: 0.0
      offset_z: 0.02

    wheel_odom:
      enabled: true
      type: 'odom'
      topic: '/odom'

    lidar_odom:
      enabled: false
      type: 'odom'
      topic: '/odom_lidar'

    # Jméno v UI = name. Web ho spáruje s objeveným topicem.
    # Jeden senzor může zůstat plochý blok (name + topic), víc kusů = items.
    # Description URDF zatím čte jen plochý blok, ne items.
    imu:
      enabled: true
      items:
        - name: 'IMU'
          enabled: true
          type: 'imu'
          topic: '/imu/data'
          frame_id: 'imu_link'
          mount_parent_frame: 'rmodus_mount'
          mount_offset: [0.0, 0.0, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          offset: [0.056, 0.020, 0.015]
          rpy: [0.0, 0.0, 0.0]

    lidar:
      enabled: true
      items:
        - name: 'Přední LiDAR'
          enabled: true
          topic: '/scan'
          frame_id: 'lidar_beam'
          mount_parent_frame: 'rmodus_mount'
          mount_offset: [0.0, 0.0, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          offset: [0.005, 0.0, 0.2]
          rpy: [0.0, 0.0, 0.0]
        # - name: 'Zadní LiDAR'
        #   enabled: true
        #   topic: '/scan_rear'
        #   frame_id: 'lidar_rear_beam'
        #   mount_parent_frame: 'rmodus_mount'
        #   mount_offset: [0.0, 0.0, 0.0]
        #   mount_rpy: [0.0, 0.0, 3.1416]
        #   offset: [-0.08, 0.0, 0.2]
        #   rpy: [0.0, 0.0, 0.0]

    # Driver (bringup.extras → neato_lidar). Jméno v UI je lidar.items[].name.
    # Druhý kus: neato_lidar.items, každý s vlastním port, topic a frame_id.
    # name tady je jméno ROS uzlu (neato_front), ne popisek v UI.
    neato_lidar:
      enabled: true
      topic: /scan
      frame_id: lidar_beam
      port: /dev/ttyUSB0
      motor_pin: 19
      frequency: 10000
      target_rpm: 300
      range_min: 0.05
      range_max: 5.0

    # Rychlost: zdroje publikují na <zdroj>/cmd_vel, twist_mux vybere podle priority
    # a výstup jde na /cmd_vel (to žere host: uart_output nebo cizí podvozek).
    # Nikdo jiný než mux na /cmd_vel publikovat nesmí
    # (teleop_twist_keyboard spouštěj s -r cmd_vel:=/teleop/cmd_vel).
    # Zámek e_stop (priorita 255) blokuje vše pod 255; estop vstup (255) posílá nuly.
    # Při bringup.estop: false se zámky vynechají.
    cmd_mux:
      enabled: true
      use_stamped: false        # Twist; musí sedět s web.cmd.use_twist_stamped
      output_topic: /cmd_vel
      inputs:
        - name: estop
          topic: /estop/cmd_vel
          priority: 255
          timeout: 0.5
        - name: teleop           # gamepad / klávesnice (teleop_twist_*)
          topic: /teleop/cmd_vel
          priority: 100
          timeout: 0.5
        - name: web
          topic: /web/cmd_vel
          priority: 90
          timeout: 0.5
        - name: nav              # Nav2 velocity_smoother
          topic: /nav/cmd_vel
          priority: 10
          timeout: 0.5
      locks:
        - name: e_stop           # bez zprávy déle než timeout = zamčeno
          topic: /rmodus/e_stop
          priority: 255
          timeout: 0.5

    uart_output:
      enabled: true
      port: '/dev/ttyUSB0'
      baudrate: 115200
      cmd_vel_topic: '/cmd_vel'
      cmd_timeout_sec: 0.5      # bez příkazu → nuly na UART

    rmodus_estop:
      enabled: true
      publish_rate_hz: 50.0
      zero_cmd_topic: /estop/cmd_vel
      state_topic: /rmodus/e_stop
      request_topic: /rmodus/e_stop/request
      reset_topic: /rmodus/e_stop/reset
      hw_active_topic: /rmodus/e_stop/hw_active
      gpio_button:
        enabled: false
        pin: 16
      platform:
        enabled: false

    flow_sensor:
      enabled: true
      type: 'twist'
      topic: '/visual_flow/data'
      frame_id: 'flow_front_link'
      mount_parent_frame: 'base_link'
      mount_offset: [0.3, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      spi_port: 0
      spi_cs: 0
      deadzone: 3
      timer_period: 0.05
      z_height: 0.025
      fov_deg: 42.0
      res_pix: 35

    bumpers:
      enabled: true
      state_topic: /robot/bumpers/state
      estop_request:
        enabled: true
        request_topic: /rmodus/e_stop/request
        retrigger_while_contact: false
      items:
        - name: front
          enabled: true
          pin: 0
          topic: /bumper/front
          frame_id: bumper_front_contact
          mount_parent_frame: base_link
          mount_offset: [0.30, 0.0, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.30, 0.05]
        - name: rear
          enabled: true
          pin: 1
          topic: /bumper/rear
          frame_id: bumper_rear_contact
          mount_parent_frame: base_link
          mount_offset: [-0.30, 0.0, 0.0]
          mount_rpy: [0.0, 0.0, 3.14159]
          size: [0.02, 0.30, 0.05]

    cliff_sensors:
      enabled: true
      address: '0x48'
      estop_request:
        enabled: true
        request_topic: /rmodus/e_stop/request
        cliff_range_threshold_m: 0.12
        retrigger_while_cliff: false
      items:
        - name: 'fl'
          enabled: true
          topic: '/cliff/fl'
          frame_id: 'cliff_sensor_fl_beam'
          pin: 0
          mount_parent_frame: 'base_link'
          mount_offset: [0.25, 0.20, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.02, 0.02]
          beam_offset: [0.0, 0.0, -0.01]
          beam_rpy: [0.0, 1.5708, 0.0]
        - name: 'fr'
          enabled: true
          topic: '/cliff/fr'
          frame_id: 'cliff_sensor_fr_beam'
          pin: 1
          mount_parent_frame: 'base_link'
          mount_offset: [0.25, -0.20, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.02, 0.02]
          beam_offset: [0.0, 0.0, -0.01]
          beam_rpy: [0.0, 1.5708, 0.0]

    display:
      enabled: true
      address: '0x3C'
      width: 128
      height: 32
      orientation: 0
      brightness: 5
      frame_id: 'display_link'
      mount_parent_frame: 'rmodus_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]

    fan:
      enabled: true
      fan_pin: 13
      frequency: 10
      min_to_run: 0.25
      user_power: [0.0, 0.5, 1.0]
