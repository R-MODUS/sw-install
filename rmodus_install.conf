#-------------------------------------------------------------------------------
#  rmodus_install.conf — volitelná konfigurace instalátoru
#
#  Zkopírujte vedle skriptu jako:  rmodus_install.conf
#    cp rmodus_install.conf.example rmodus_install.conf
#  Upravte hodnoty (0 = vypnuto, 1 = zapnuto). Prázdný soubor není potřeba —
#  bez souboru platí výchozí hodnoty uvnitř rmodus_install.sh.
#
#  Alternativně: cesta k jinému confu
#    export RMODUS_INSTALL_CONF=/cesta/k/muj.conf
#    bash rmodus_install.sh
#-------------------------------------------------------------------------------

# --- sw-nav-module (sparse) ---
FETCH_SW_NAV_MODULE=1
# Mezerami oddělené názvy kořenových složek v repu R-MODUS/sw-nav-module (větev SW_NAV_BRANCH)
SW_NAV_SPARSE_DIRS="rmodus_hw rmodus_web rmodus_interface"
SW_NAV_BRANCH="main"

# --- Xsens MTi ROS 2 driver ---
FETCH_XSENS_DRIVER=0
# make v lib/xspublic před colcon (jen pokud je stažený driver)
BUILD_XSPUBLIC=1
# Kopie 99-xsens-mti.rules do /etc/udev/rules.d/
INSTALL_XSENS_UDEV=1

# --- rf2o_laser_odometry ---
FETCH_RF2O=0
# Dvě fáze colconu (bez rf2o → pak jen rf2o + linker šetřící RAM na Pi). 0 = jeden colcon na celý src.
BUILD_RF2O_SEPARATE_PHASE=1

# --- systemd ---
ENABLE_SYSTEMD_RMODUS=1
